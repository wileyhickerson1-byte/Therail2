<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Rail — Home Game Ledger</title>
  <meta name="description" content="Track buy-ins, cash-outs, standings and who owes who for your home poker games." />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#081611" />

  <!-- iOS home-screen app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="The Rail" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />

  <style>
    html, body { margin: 0; padding: 0; background: #081611; }
    html { -webkit-text-size-adjust: 100%; }
    #root { min-height: 100vh; }
    /* first-paint splash while app.js loads */
    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #081611; color: #d4af6a; font-family: system-ui, sans-serif;
    }
    #boot svg { animation: bp 1.4s ease-in-out infinite; }
    @keyframes bp { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
  </style>
</head>
<body>
  <div id="root">
    <div id="boot">
      <svg width="48" height="48" viewBox="0 0 34 34">
        <circle cx="17" cy="17" r="16" fill="#153a2c" stroke="#d4af6a" stroke-width="1.5"/>
        <circle cx="17" cy="17" r="10.5" fill="none" stroke="#d4af6a" stroke-width="1.5" stroke-dasharray="3 3.6"/>
        <circle cx="17" cy="17" r="5.5" fill="#d4af6a"/>
      </svg>
    </div>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
